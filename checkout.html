<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkout - Craveh</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="header">
    <div class="container header-container">
      <div class="logo">
        <h1>craveh</h1>
      </div>
      <button class="hamburger" id="hamburger-btn" aria-label="Toggle menu"><span></span><span></span><span></span></button>
      <nav class="nav" id="main-nav">
        <a href="menu.html" class="nav-link">Menu</a>
        <a href="history.html" class="nav-link">History</a>
        <a href="checkout.html" class="nav-link active">Checkout <span class="cart-badge">1</span></a>
        <a href="account.html" class="nav-link">user</a>
      </nav>
    </div>
  </header>

  <main class="main-content">
    <div class="container checkout-container">
      <div class="page-header">
        <h1 class="page-title">Checkout</h1>
        <p class="page-subtitle">Review your order and complete delivery details</p>
      </div>

      <div class="checkout-section">
        <div class="checkout-step-header">
          <div class="checkout-step-number">1</div>
          <h3>Order Summary</h3>
        </div>

        <div class="checkout-item">
          <div class="checkout-item-info">
            <img class="checkout-item-image" src="https://picsum.photos/seed/craveh-salad/100/100" alt="Caesar Salad">
            <div class="checkout-item-details">
              <span class="checkout-item-name">Caesar Salad</span>
              <span class="checkout-item-price">₱89.00 each</span>
            </div>
          </div>
          <div class="checkout-item-controls">
            <div class="quantity-controls">
              <button class="quantity-btn">−</button>
              <span class="quantity-display">1</span>
              <button class="quantity-btn">+</button>
            </div>
            <button class="btn-remove">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 01-2 2H8a2 2 0 01-2-2L5 6"/></svg>
            </button>
          </div>
        </div>

        <div class="checkout-total">
          <span>Total</span>
          <span class="checkout-total-amount">₱89.00</span>
        </div>

        <div class="checkout-delivery-notice">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3h13v13H3z"/><path d="M16 8h4l3 4v5h-7V8z"/><circle cx="7" cy="19" r="2"/><circle cx="18" cy="19" r="2"/></svg>
          Free Delivery
        </div>
      </div>

      <div class="checkout-section">
        <div class="checkout-step-header">
          <div class="checkout-step-number">2</div>
          <h3>Delivery Information</h3>
        </div>
        <div class="form-group">
          <label for="co-street">Street Address</label>
          <input type="text" id="co-street" placeholder="123 Main St">
        </div>
        <div class="form-row">
          <div class="form-group form-group-flex">
            <label for="co-city">City</label>
            <input type="text" id="co-city" placeholder="City">
          </div>
          <div class="form-group form-group-flex">
            <label for="co-state">State</label>
            <input type="text" id="co-state" placeholder="State">
          </div>
          <div class="form-group form-group-flex">
            <label for="co-zip">ZIP Code</label>
            <input type="text" id="co-zip" placeholder="10001">
          </div>
        </div>
        <div class="form-group">
          <label for="co-building">Building Name <span class="label-optional">(optional)</span></label>
          <input type="text" id="co-building" placeholder="e.g. Sunrise Apartments">
        </div>
        <div class="form-row">
          <div class="form-group form-group-flex">
            <label for="co-floor">Floor <span class="label-optional">(optional)</span></label>
            <input type="text" id="co-floor" placeholder="e.g. 3rd">
          </div>
          <div class="form-group form-group-flex">
            <label for="co-apt">Apt / Suite / Unit <span class="label-optional">(optional)</span></label>
            <input type="text" id="co-apt" placeholder="e.g. 4B">
          </div>
        </div>
        <div class="form-group">
          <label for="co-landmark">Landmark <span class="label-optional">(optional)</span></label>
          <input type="text" id="co-landmark" placeholder="e.g. Near Central Park, opposite the bank">
        </div>
        <div class="form-group">
          <label for="co-notes">Delivery Notes <span class="label-optional">(optional)</span></label>
          <textarea id="co-notes" placeholder="Gate code, ring doorbell, etc."></textarea>
        </div>
        <div class="form-group">
          <label for="co-phone">Phone Number</label>
          <input type="tel" id="co-phone" placeholder="Enter your phone number">
        </div>
      </div>

      <div class="checkout-section">
        <div class="checkout-step-header">
          <div class="checkout-step-number">3</div>
          <h3>Payment Method</h3>
        </div>
        <div class="payment-method-card">
          <div class="payment-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="1" y="4" width="22" height="16" rx="2"/><line x1="1" y1="10" x2="23" y2="10"/></svg>
          </div>
          <div class="payment-details">
            <p>Cash on Delivery</p>
            <p>Pay when you receive your order</p>
          </div>
        </div>
      </div>

      <button class="btn btn-primary btn-block btn-place-order">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg>
        Place Order - ₱89.00
      </button>
    </div>
  </main>

  <footer class="footer"><div class="container">&copy; 2026 <span class="footer-brand">Craveh</span>. All rights reserved.</div></footer>
</body>
</html>
