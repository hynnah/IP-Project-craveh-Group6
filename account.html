<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Account - Craveh</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="header">
    <div class="container header-container">
      <div class="logo">
        <h1>craveh</h1>
      </div>
      <button class="hamburger" id="hamburger-btn" aria-label="Toggle menu"><span></span><span></span><span></span></button>
      <nav class="nav" id="main-nav">
        <a href="menu.html" class="nav-link">Menu</a>
        <a href="history.html" class="nav-link">History</a>
        <a href="checkout.html" class="nav-link">Checkout <span class="cart-badge" hidden></span></a>
        <a href="account.html" class="nav-link active">Account</a>
      </nav>
    </div>
  </header>

  <main class="main-content">
    <div class="container">
      <div class="page-header">
        <h1 class="page-title">My Account</h1>
        <p class="page-subtitle">Manage your profile and delivery preferences</p>
      </div>

      <div class="auth-container" id="auth-view">
        <div class="form-card">
          <h2 id="auth-title">Login</h2>
          <form id="auth-form" novalidate>
            <div class="form-group" id="name-group" hidden>
              <label for="name-input">Name</label>
              <input type="text" id="name-input" autocomplete="name">
            </div>
            <div class="form-group">
              <label for="email-input">Email</label>
              <input type="email" id="email-input" autocomplete="email">
            </div>
            <div class="form-group">
              <label for="password-input">Password</label>
              <input type="password" id="password-input" autocomplete="current-password">
            </div>
            <p class="error-message" id="auth-error" role="alert"></p>
            <button type="submit" class="btn btn-primary btn-block" id="auth-submit">Login</button>
          </form>

          <!-- Both stay hidden until auth_config.php confirms a client ID is
               configured and Google's library has loaded. -->
          <div class="auth-divider" id="google-divider" hidden><span>or</span></div>
          <div class="google-signin" id="google-signin-btn" hidden></div>

          <p class="auth-toggle">
            <span id="auth-toggle-text">Don't have an account? </span>
            <button type="button" class="link-btn" id="auth-toggle-btn">Sign Up</button>
          </p>
        </div>
      </div>

      <div class="profile-container" id="profile-view" hidden>
        <div class="profile-card profile-header-card">
          <div class="profile-header">
            <div class="profile-info">
              <h2 id="profile-name"></h2>
              <p id="profile-email"></p>
            </div>
          </div>
          <button type="button" class="btn btn-secondary btn-block" id="logout-btn">Logout</button>
        </div>
      </div>
    </div>
  </main>

  <footer class="footer"><div class="container">&copy; 2026 <span class="footer-brand">Craveh</span>. All rights reserved.</div></footer>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script src="assets/js/common.js"></script>
  <script src="assets/js/account.js"></script>
</body>
</html>
