<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Account - Craveh</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="header">
    <div class="container header-container">
      <div class="logo">
        <h1>craveh</h1>
      </div>
      <button class="hamburger" id="hamburger-btn" aria-label="Toggle menu"><span></span><span></span><span></span></button>
      <nav class="nav" id="main-nav">
        <a href="menu.html" class="nav-link">Menu</a>
        <a href="history.html" class="nav-link">History</a>
        <a href="checkout.html" class="nav-link">Checkout <span class="cart-badge">2</span></a>
        <a href="account.html" class="nav-link active">Account</a>
      </nav>
    </div>
  </header>

  <main class="main-content">
    <div class="container">
      <div class="page-header">
        <h1 class="page-title">My Account</h1>
        <p class="page-subtitle">Manage your profile and delivery preferences</p>
      </div>

      <div class="auth-container">
        <div class="form-card">
          <h2>Login</h2>
          <form>
            <div class="form-group">
              <label for="email-input">Email</label>
              <input type="email" id="email-input">
            </div>
            <div class="form-group">
              <label for="password-input">Password</label>
              <input type="password" id="password-input">
            </div>
            <button type="button" class="btn btn-primary btn-block">Login</button>
          </form>
          <p class="auth-toggle">
            <span>Don't have an account? </span>
            <button type="button" class="link-btn">Sign Up</button>
          </p>
        </div>
      </div>
    </div>
  </main>

  <footer class="footer"><div class="container">&copy; 2026 <span class="footer-brand">Craveh</span>. All rights reserved.</div></footer>
</body>
</html>
